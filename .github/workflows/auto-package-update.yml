name: auto package update

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  auto-package-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Must be used to trigger workflow after push
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Copy .env
        run: php -r "copy('.env.ci', '.env');"

      - uses: ./.github/actions/php

      - name: Run composer update
        run: composer update && composer bump && composer update

      - # commit only to core contributors who have repository access
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "[ci] package-updates"
          commit_author: "GitHub Action <actions@github.com>"
          commit_user_email: "action@github.com"
